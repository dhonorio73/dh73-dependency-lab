<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Protótipo Dh73 Enterprise</title>
  <desc id="desc">Dashboard corporativo com áreas de abastecimento, almoxarifado, recursos humanos, gerência, portaria e segurança.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101326"/><stop offset="1" stop-color="#29224f"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#222642"/><stop offset="1" stop-color="#1a1d34"/></linearGradient>
  </defs>
  <rect width="1400" height="820" rx="30" fill="url(#bg)"/>
  <rect x="34" y="34" width="250" height="752" rx="22" fill="#15182a" stroke="#3c4164"/>
  <rect x="64" y="70" width="38" height="38" rx="11" fill="#b3a3ff"/>
  <text x="76" y="97" fill="#17152a" font-family="Arial" font-size="20" font-weight="700">D</text>
  <text x="116" y="96" fill="#f7f6ff" font-family="Arial" font-size="23" font-weight="700">dh73</text>
  <text x="184" y="96" fill="#9da2c2" font-family="Arial" font-size="18">enterprise</text>
  <text x="64" y="164" fill="#7f86ad" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">ÁREAS DISPONÍVEIS</text>

  <text x="334" y="87" fill="#a999ff" font-family="Arial" font-size="14" font-weight="700" letter-spacing="3">AMBIENTE CORPORATIVO</text>
  <text x="334" y="133" fill="#f8f7ff" font-family="Arial" font-size="38" font-weight="700">Dashboard</text>
  <rect x="1090" y="70" width="240" height="48" rx="24" fill="#20243d" stroke="#3c4164"/>
  <circle cx="1118" cy="94" r="6" fill="#7df1c9"/><text x="1134" y="100" fill="#e1e2f0" font-family="Arial" font-size="16">Administrador</text>
  <rect x="334" y="166" width="996" height="58" rx="10" fill="#292552" stroke="#a999ff" stroke-opacity=".45"/>
  <text x="358" y="201" fill="#ded9ff" font-family="Arial" font-size="17">Perfil simulado: Administrador · 9 áreas disponíveis</text>
  <g font-family="Arial">
    <rect x="334" y="264" width="306" height="150" rx="16" fill="url(#card)" stroke="#3c4164"/><text x="360" y="301" fill="#aeb2ca" font-size="16">Áreas liberadas</text><text x="360" y="362" fill="#b6a8ff" font-size="42" font-weight="700">9</text><text x="360" y="391" fill="#aeb2ca" font-size="14">neste perfil</text>
    <rect x="668" y="264" width="306" height="150" rx="16" fill="url(#card)" stroke="#3c4164"/><text x="694" y="301" fill="#aeb2ca" font-size="16">Pendências</text><text x="694" y="362" fill="#f5c36b" font-size="42" font-weight="700">08</text><text x="694" y="391" fill="#aeb2ca" font-size="14">aguardando ação</text>
    <rect x="1002" y="264" width="328" height="150" rx="16" fill="url(#card)" stroke="#3c4164"/><text x="1028" y="301" fill="#aeb2ca" font-size="16">Alertas</text><text x="1028" y="362" fill="#ff92a3" font-size="42" font-weight="700">03</text><text x="1028" y="391" fill="#aeb2ca" font-size="14">últimas 24 horas</text>
